say:
  generate:
    do: "nu mise-lazybox.nu -f"
  lint:
    do: "nu mise-lazybox.test.nu"
  build:
    do: "docker build --target lazybox -t bonisoft3/lazybox ."
  test:
    do: "nu mise-lazybox.test.nu"
  release:
    do: >-
      [[target tag]; [lazybox bonisoft3/lazybox] [nubox bonisoft3/lazybox:nubox]]
      | each { |r| ^docker build --target $r.target -t $r.tag . }
